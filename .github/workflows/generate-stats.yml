name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00:00 BR
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate GitHub Stats SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: FelipeAkryghti

          # tamanho maior
          style: dark
          width: 900

          # seções
          base: header, activity, languages
          plugin_activity: total_commits, total_prs, total_issues
          
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # layout mais largo
          config_padding: 30
          config_spacing: 24

          # textos
          config_title: "Felipe Akryghti · GitHub Stats"
          config_subtitle: "Software Engineer Student"
