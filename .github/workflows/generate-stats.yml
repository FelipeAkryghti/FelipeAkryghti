name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00:00 BR
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para a Action salvar o arquivo no seu repositório

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Gera o arquivo SVG idêntico ao da imagem, mas com os seus dados
      - name: Generate GitHub Stats SVG
        run: |
          curl "https://github-readme-stats.vercel.app/api?username=FelipeAkryghti&custom_title=Felipe%20Akryghti's%20GitHub%20Stats&bg_color=0a111a&title_color=61bdf2&icon_color=61bdf2&text_color=ffffff&show_icons=true&hide_border=true&count_private=true" > generate-metrics.svg

      # Faz o commit automático do arquivo de volta para o seu GitHub
      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub stats SVG"
          file_pattern: "generate-metrics.svg"
